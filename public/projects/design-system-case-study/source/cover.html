<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design System Case Study Cover Source</title>
    <style>
      :root {
        --ink: #2f347f;
        --muted: #5f6376;
        --line: #e7e9f7;
        --blue: #5d62d8;
        --soft: #f6f7ff;
        --panel: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #edf0fb;
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .frame {
        position: relative;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(246, 247, 255, 0.96), rgba(255, 255, 255, 0.92)),
          repeating-linear-gradient(0deg, transparent 0 55px, var(--line) 56px),
          repeating-linear-gradient(90deg, transparent 0 55px, var(--line) 56px),
          #ffffff;
      }

      .card {
        position: absolute;
        left: 160px;
        top: 145px;
        width: 520px;
        height: 560px;
        border: 2px solid rgba(93, 98, 216, 0.1);
        border-radius: 42px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 36px 80px rgba(54, 57, 134, 0.12);
      }

      .swatches {
        position: absolute;
        left: 70px;
        top: 78px;
        display: flex;
        gap: 30px;
      }

      .swatch {
        width: 118px;
        height: 118px;
        border-radius: 22px;
        background: var(--blue);
        box-shadow: inset 0 0 0 1px rgba(54, 57, 134, 0.06);
      }

      .swatch:nth-child(2) {
        background: #f0f1ff;
      }

      .swatch:nth-child(3) {
        background: #2f2f2f;
      }

      .token-card {
        position: absolute;
        left: 70px;
        bottom: 86px;
        width: 380px;
        height: 160px;
        border-radius: 22px;
        background: var(--panel);
        box-shadow: 0 18px 48px rgba(54, 57, 134, 0.1);
      }

      .token-line {
        position: absolute;
        left: 46px;
        width: 290px;
        height: 26px;
        border-radius: 9px;
        background: #f0f1ff;
      }

      .token-line:first-child {
        top: 48px;
      }

      .token-line:last-child {
        top: 88px;
      }

      .token-label {
        position: absolute;
        left: 56px;
        color: var(--ink);
        font-size: 18px;
        font-weight: 800;
      }

      .token-label.one {
        top: 49px;
      }

      .token-label.two {
        top: 89px;
      }

      .title {
        position: absolute;
        left: 840px;
        top: 165px;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #646bda;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: 0;
      }

      h1 {
        margin: 0;
        color: var(--ink);
        font-size: 76px;
        line-height: 0.95;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 28px 0 0;
        color: var(--muted);
        font-size: 30px;
        font-weight: 800;
      }

      .pills {
        position: absolute;
        left: 840px;
        top: 460px;
        display: grid;
        gap: 28px;
      }

      .pill {
        width: 455px;
        border-radius: 18px;
        padding: 22px 34px;
        background: rgba(255, 255, 255, 0.9);
        color: var(--ink);
        font-size: 26px;
        font-weight: 800;
        box-shadow: 0 16px 42px rgba(54, 57, 134, 0.1);
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <section class="card">
        <div class="swatches">
          <div class="swatch"></div>
          <div class="swatch"></div>
          <div class="swatch"></div>
        </div>
        <div class="token-card">
          <div class="token-line"></div>
          <div class="token-line"></div>
          <div class="token-label one">tokens</div>
          <div class="token-label two">components</div>
        </div>
      </section>

      <section class="title">
        <p class="eyebrow">Design System</p>
        <h1>Case Study</h1>
        <p class="subtitle">tokens / contracts / governance</p>
      </section>

      <section class="pills" aria-label="Case study principles">
        <div class="pill">Audit before implementation</div>
        <div class="pill">Share shells, keep story local</div>
        <div class="pill">Validate every small batch</div>
      </section>
    </main>
  </body>
</html>
